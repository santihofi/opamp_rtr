parameters:
  temp: [27]
  seed: range(1)
  vdd: [3.3]
  vincm: [1.65, 0.2, 3.1]
  sigma: [1]
  corner_mos: ['tt']
  ibias: ['1u']
  c_load: ['50f', '5p']
  corner_cap: ['typ']
  corner_res: ['typ']
tests:
  tb_opamp_rtr_op:
    engine: ngspice
    op1.vos:
      unit: 'V'
      min: -0.01
      max: 0.01
      typ: 0.0
    op1.idd:
      unit: 'A'
    noise2.onoise_total: {}
  tb_opamp_rtr_gain:
    gain:
      unit: 'dB'
      min: 40.0
    ac_signals: [out]
    UGF:
      unit: 'Hz'
    phase_margin:
      unit: "\xB0"
equations:
  vd_tr: outp-outn
transient_equations:
  out_d: outp-outn
