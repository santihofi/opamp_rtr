parameters:
  temp: [-40, 27, 100]
  seed: range(1)
  vdd: [3.3]
  vincm: [1.65, 0.2, 3.1]
  sigma: [1]
  corner_mos: ['tt', 'ss', 'ff', 'sf', 'fs']
  ibias: ['1u']
  c_load: ['50f', '8p']
  corner_cap: ['wcs']
  corner_res: ['wcs', 'bcs']
  mm_ok_stg1: [1]
tests:
  tb_opamp_rtr_op:
    engine: ngspice
    op1.vos:
      unit: 'V'
      min: -0.01
      max: 0.01
      typ: 0.0
    op1.idd:
      unit: 'A'
    noise2.onoise_total: {}
  tb_opamp_rtr_gain:
    gain:
      unit: 'dB'
      min: 40.0
    UGF:
      unit: 'Hz'
      min: 100000.0
    phase_margin:
      unit: "\xB0"
      min: 50.0
    ac_signals: [out]
  tb_opamp_rtr_tran:
    transient_signals: [out, x1.out1_p, x1.out1_n]
    engine: ngspice
  tb_opamp_rtr_tran_psr:
    transient_signals: [out_psr]
    engine: ngspice
equations:
  vd_tr: outp-outn
transient_equations:
  out_d: outp-outn
