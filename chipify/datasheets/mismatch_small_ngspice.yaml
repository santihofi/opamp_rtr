parameters:
  temp: [27]
  seed: range(100)
  vdd: [3.3]
  vincm: [1.65, 0.2, 3.1]
  sigma: [1]
  corner_mos: ['tt_mismatch']
  ibias: ['1u']
  c_load: ['100f']
  corner_cap: ['typ_mismatch']
  corner_res: ['typ_mismatch']
  mm_ok_stg1: [0, 1]
tests:
  tb_opamp_rtr_op:
    engine: ngspice
    op1.vos:
      unit: 'V'
      min: -0.01
      max: 0.01
      typ: 0.0
    op1.idd: {}
    noise2.onoise_total: {}
  tb_opamp_rtr_gain:
    gain:
      unit: 'dB'
      min: 40.0
    UGF:
      unit: 'Hz'
      min: 100000.0
    phase_margin:
      unit: "\xB0"
      min: 50.0
    ac_signals: [out]
    engine: ngspice
equations:
  vd_tr: outp-outn
transient_equations:
  out_d: outp-outn
